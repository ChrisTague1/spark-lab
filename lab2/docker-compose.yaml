services:

  master:
    image: spark-yarn-lab
    hostname: master
    container_name: spark-yarn-master

    ports:
      # HDFS NameNode UI
      - "9870:9870"

      # YARN ResourceManager UI
      - "8088:8088"

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/master/8032'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./config/capacity-scheduler.xml:/opt/hadoop/etc/hadoop/capacity-scheduler.xml
      - ./jobs:/workspace/jobs
      - namenode-data:/data/namenode

    command: >
      bash -c "
        if [ ! -d /data/namenode/current ]; then
          hdfs namenode -format -force;
        fi;
        hdfs --daemon start namenode;
        yarn --daemon start resourcemanager;
        tail -f /dev/null
      "

  worker1:
    image: spark-yarn-lab
    hostname: worker1
    container_name: spark-yarn-worker1

    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./config/capacity-scheduler.xml:/opt/hadoop/etc/hadoop/capacity-scheduler.xml
      - ./jobs:/workspace/jobs
      - worker1-data:/data/datanode

    depends_on:
      - master

    command: >
      bash -c "
        hdfs --daemon start datanode;
        yarn --daemon start nodemanager;
        tail -f /dev/null
      "

  worker2:
    image: spark-yarn-lab
    hostname: worker2
    container_name: spark-yarn-worker2

    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./config/capacity-scheduler.xml:/opt/hadoop/etc/hadoop/capacity-scheduler.xml
      - ./jobs:/workspace/jobs
      - worker2-data:/data/datanode

    depends_on:
      - master

    command: >
      bash -c "
        hdfs --daemon start datanode;
        yarn --daemon start nodemanager;
        tail -f /dev/null
      "

  worker3:
    image: spark-yarn-lab
    hostname: worker3
    container_name: spark-yarn-worker3

    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./config/capacity-scheduler.xml:/opt/hadoop/etc/hadoop/capacity-scheduler.xml
      - ./jobs:/workspace/jobs
      - worker3-data:/data/datanode

    depends_on:
      - master

    command: >
      bash -c "
        hdfs --daemon start datanode;
        yarn --daemon start nodemanager;
        tail -f /dev/null
      "

  connect:
    image: spark-yarn-lab
    hostname: connect
    container_name: spark-yarn-connect

    ports:
      # Spark Connect gRPC endpoint
      - "15002:15002"

      # Spark UI for the Connect server application
      - "4040:4040"

    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./config/capacity-scheduler.xml:/opt/hadoop/etc/hadoop/capacity-scheduler.xml
      - ./jobs:/workspace/jobs
      - spark-ivy-cache:/root/.ivy2

    depends_on:
      master:
        condition: service_healthy
      worker1:
        condition: service_started
      worker2:
        condition: service_started
      worker3:
        condition: service_started

    command:
      - bash
      - -ec
      - |
        /opt/spark/sbin/start-connect-server.sh \
          --master yarn \
          --deploy-mode client \
          --packages "$${SPARK_CONNECT_PACKAGE}" \
          --conf spark.connect.grpc.binding.port=15002
        exec tail -F /opt/spark/logs/*SparkConnectServer*.out

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/15002'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  namenode-data:
  worker1-data:
  worker2-data:
  worker3-data:
  spark-ivy-cache:
